transformations:
  - use Admin-0 geometry for countries left whole by the region policy
  - group selected Admin-1 units into explicitly authored strategic regions
  - dissolve obsolete Admin-1 borders inside each strategic region during asset generation
  - keep strategically important overseas territories separate from European homelands
  - omit Antarctica from the playable map
  - exclude modern leases, buffer zones, disputed tracts, and special areas that were not
    separately playable regions in 1880-95 (BRT, CNM, CSI, CYN, ESB, IOA, IOT, KAB, KAS,
    SPI, UMI, USG, WSB)
  - replace the modern Hong Kong S.A.R. display name with Hong Kong
  - project longitude/latitude coordinates using latitude-first projection calls
  - preserve source geometry detail; measured rendering does not currently justify simplification
political_interpretation: none; historical control is separate campaign data
