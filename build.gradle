tasks.register('prepareStrategicMapSource', JavaExec) {
    group = 'map assets'
    description = 'Applies the reviewed region policy to local pinned Natural Earth sources.'
    dependsOn tasks.named('mapToolsClasses')
    classpath = sourceSets.mapTools.runtimeClasspath
    mainClass = 'dn.strategicmap.pipeline.NaturalEarthRegionSourceBuilder'
    maxHeapSize = '2g'
    args layout.projectDirectory.file(
            'tmp/map-sources/ne_10m_admin_0_countries.geojson').asFile,
        layout.projectDirectory.file(
            'tmp/map-sources/ne_10m_admin_1_states_provinces.geojson').asFile,
        regionGrouping.asFile,
        regionSource.asFile
    inputs.file layout.projectDirectory.file(
        'tmp/map-sources/ne_10m_admin_0_countries.geojson')
    inputs.file layout.projectDirectory.file(
        'tmp/map-sources/ne_10m_admin_1_states_provinces.geojson')
    inputs.file regionGrouping
    outputs.file regionSource
}

tasks.register('generateStrategicMapAsset', JavaExec) {
    group = 'map assets'
    description = 'Builds the prepared runtime strategic-map asset.'
    dependsOn tasks.named('mapToolsClasses')
    mustRunAfter tasks.named('prepareStrategicMapSource')
    classpath = sourceSets.mapTools.runtimeClasspath
    mainClass = 'dn.strategicmap.pipeline.StrategicMapAssetBuilder'
    maxHeapSize = '2g'
    args regionSource.asFile, generatedMapAsset.get().asFile
    inputs.file regionSource
    outputs.file generatedMapAsset
}

tasks.register('generateTopographicReliefPreview', JavaExec) {
    group = 'map assets'
    description = 'Builds aligned neutral and period-ink Natural Earth relief candidates.'
    dependsOn tasks.named('mapToolsClasses')
    classpath = sourceSets.mapTools.runtimeClasspath
    mainClass = 'dn.strategicmap.pipeline.TopographicReliefAssetBuilder'
    maxHeapSize = '1g'
    args layout.projectDirectory.file('tmp/map-sources/MSR_50M/MSR_50M.tif').asFile,
        regionSource.asFile,
        generatedTopographicReliefDirectory.get().asFile
    inputs.files(
        layout.projectDirectory.file('tmp/map-sources/MSR_50M/MSR_50M.tif'),
        regionSource)
    outputs.files(
        generatedTopographicReliefDirectory.map { it.file('topographic-relief-base.png') },
        generatedTopographicReliefDirectory.map { it.file('topographic-relief-ink.png') },
        generatedTopographicReliefDirectory.map {
            it.file('topographic-relief-alignment-preview.png')
        })
}

