tasks.register('prepareGrandTheatreReferenceTargets', JavaExec) {
    group = 'map assets'
    description = 'Builds the catalogue-derived GRAND/THEATRE reference-label target set.'
    dependsOn tasks.named('mapToolsClasses')
    classpath = sourceSets.mapTools.runtimeClasspath
    mainClass = 'dn.GrandTheatreReferenceTargetBuilder'
    def referenceMap = providers.gradleProperty('referenceMap')
    inputs.files(
        layout.projectDirectory.file(
            'src/mapTools/resources/labels/philip-1905-calibration.tsv'),
        layout.projectDirectory.file('src/main/resources/maps/geographic-labels.tsv'),
        layout.projectDirectory.file(
            'src/main/resources/presentation/political-labels-1895.tsv'),
        layout.projectDirectory.file('src/main/resources/politics/actors-1895.tsv'),
        layout.projectDirectory.file(
            'src/mapTools/resources/labels/display-label-extraction-targets.tsv'))
    if (referenceMap.isPresent()) {
        inputs.file(file(referenceMap.get()))
    }
    outputs.files grandTheatreLabelCatalogue, grandTheatreReferenceTargets
    doFirst {
        if (!referenceMap.isPresent()) {
            throw new GradleException(
                'Supply the uncommitted reference scan with -PreferenceMap=/absolute/path/image.jpg')
        }
        args referenceMap.get(),
            layout.projectDirectory.file(
                'src/mapTools/resources/labels/philip-1905-calibration.tsv').asFile,
            layout.projectDirectory.file('src/main/resources/maps/geographic-labels.tsv').asFile,
            layout.projectDirectory.file(
                'src/main/resources/presentation/political-labels-1895.tsv').asFile,
            layout.projectDirectory.file('src/main/resources/politics/actors-1895.tsv').asFile,
            layout.projectDirectory.file(
                'src/mapTools/resources/labels/display-label-extraction-targets.tsv').asFile,
            grandTheatreLabelCatalogue.get().asFile,
            grandTheatreReferenceTargets.get().asFile
    }
}

tasks.register('extractReferenceDisplayLabels', JavaExec) {
    group = 'map assets'
    description = 'Builds local review evidence for widely tracked reference-map labels.'
    dependsOn tasks.named('mapToolsClasses')
    dependsOn tasks.named('prepareGrandTheatreReferenceTargets')
    classpath = sourceSets.mapTools.runtimeClasspath
    mainClass = 'dn.strategicmap.pipeline.ReferenceDisplayLabelExtractor'
    maxHeapSize = '2g'
    def referenceMap = providers.gradleProperty('referenceMap')
    inputs.files(
        layout.projectDirectory.file(
            'src/mapTools/resources/labels/philip-1905-calibration.tsv'),
        grandTheatreReferenceTargets)
    if (referenceMap.isPresent()) {
        inputs.file(file(referenceMap.get()))
    }
    outputs.dir layout.buildDirectory.dir('reports/reference-label-extraction')
    doFirst {
        if (!referenceMap.isPresent()) {
            throw new GradleException(
                'Supply the uncommitted reference scan with -PreferenceMap=/absolute/path/image.jpg')
        }
        args referenceMap.get(),
            layout.projectDirectory.file(
                'src/mapTools/resources/labels/philip-1905-calibration.tsv').asFile,
            grandTheatreReferenceTargets.get().asFile,
            layout.buildDirectory.dir('reports/reference-label-extraction').get().asFile
    }
}

tasks.register('runReferenceDisplayLabelOcr', Exec) {
    group = 'map assets'
    description = 'Runs local PaddleOCR and merges it with display-label fallback evidence.'
    dependsOn tasks.named('extractReferenceDisplayLabels')
    def referenceMap = providers.gradleProperty('referenceMap')
    def paddleOcrPython = providers.gradleProperty('paddleOcrPython')
    inputs.files(
        layout.projectDirectory.file('src/mapTools/python/reference_label_ocr.py'),
        grandTheatreReferenceTargets,
        layout.buildDirectory.file(
            'reports/reference-label-extraction/display-label-candidates.tsv'))
    if (referenceMap.isPresent()) {
        inputs.file(file(referenceMap.get()))
    }
    outputs.dir layout.buildDirectory.dir('reports/reference-label-ocr')
    doFirst {
        if (!referenceMap.isPresent()) {
            throw new GradleException(
                'Supply the uncommitted reference scan with -PreferenceMap=/absolute/path/image.jpg')
        }
        if (!paddleOcrPython.isPresent()) {
            throw new GradleException(
                'Supply a PaddleOCR Python executable with -PpaddleOcrPython=/absolute/path/python')
        }
        commandLine paddleOcrPython.get(),
            layout.projectDirectory.file(
                'src/mapTools/python/reference_label_ocr.py').asFile,
            referenceMap.get(),
            grandTheatreReferenceTargets.get().asFile,
            layout.buildDirectory.file(
                'reports/reference-label-extraction/display-label-candidates.tsv').get().asFile,
            layout.buildDirectory.dir('reports/reference-label-ocr').get().asFile
    }
}

tasks.register('compileGrandTheatreCandidateLayout', JavaExec) {
    group = 'map assets'
    description = 'Compiles located reference evidence and explicit absent-title fallbacks for review.'
    dependsOn tasks.named('runReferenceDisplayLabelOcr')
