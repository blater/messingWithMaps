tasks.named('processResources') {
    dependsOn tasks.named('generateStrategicMapAsset')
    dependsOn tasks.named('prepareStrategicLabelOrientations')
    inputs.file generatedMapAsset
    exclude 'maps/world_1880.geojson'
    exclude 'maps/world_1880-regions.tsv'
    exclude 'maps/world_1880.source.yml'
}

def skipStrategicLabelGeneration = providers.gradleProperty('skipStrategicLabelGeneration')
    .map { it.toBoolean() }.orElse(false)

if (!skipStrategicLabelGeneration.get()) {
    tasks.named('processResources') {
        dependsOn tasks.named('prepareStrategicLabelGlyphs')
        dependsOn tasks.named('prepareStrategicLabelBaseGlyphs')
        inputs.files generatedStrategicLabelGlyphs, generatedStrategicLabelBaseGlyphs
        doLast {
            copy {
                from generatedStrategicLabelGlyphs
                from generatedStrategicLabelBaseGlyphs
                into layout.buildDirectory.dir('resources/main/presentation')
            }
        }
    }
}
