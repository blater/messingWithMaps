plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'dn.DesktopLauncher'
}

sourceSets {
    mapTools {
        java.srcDir 'src/mapTools/java'
        compileClasspath += sourceSets.main.output.classesDirs
        runtimeClasspath += sourceSets.main.output.classesDirs
    }
    main.resources.srcDir layout.buildDirectory.dir('generated-resources/main')
}

tasks.named('run', JavaExec) {
    if (System.getProperty('os.name').toLowerCase().contains('mac')) {
        jvmArgs '-XstartOnFirstThread'
    }
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url 'https://oss.sonatype.org/content/groups/public' } // libGDX artifacts
}

dependencies {
    // Core
    implementation 'com.badlogicgames.gdx:gdx:1.11.0'

    // Desktop backend (LWJGL3)
    implementation 'com.badlogicgames.gdx:gdx-backend-lwjgl3:1.11.0'
    implementation 'com.badlogicgames.gdx:gdx-platform:1.11.0:natives-desktop'

    // Optional: FreeType for custom fonts
    implementation 'com.badlogicgames.gdx:gdx-freetype:1.11.0'
    implementation 'com.badlogicgames.gdx:gdx-freetype-platform:1.11.0:natives-desktop'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation files(sourceSets.mapTools.output)
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    mapToolsImplementation 'com.badlogicgames.gdx:gdx:1.11.0'
    mapToolsImplementation 'org.locationtech.jts:jts-core:1.20.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('compileMapToolsJava') {
    dependsOn tasks.named('compileJava')
}

tasks.named('compileTestJava') {
    dependsOn tasks.named('mapToolsClasses')
}

