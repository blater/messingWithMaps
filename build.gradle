def registerGrandTheatreRegionalPreview = { taskName, descriptionText, output,
                                             west, south, east, north ->
    tasks.register(taskName, JavaExec) {
        group = 'map assets'
        description = descriptionText
        dependsOn tasks.named('prepareGrandTheatreCandidateGlyphs')
        dependsOn tasks.named('generateStrategicMapAsset')
        classpath = sourceSets.mapTools.runtimeClasspath
        mainClass = 'dn.strategicmap.pipeline.PreparedLabelGlyphPreviewBuilder'
        args grandTheatreCandidateGlyphs.get().asFile,
            layout.projectDirectory.file('src/main/resources/fonts/EBGaramond-Regular.ttf').asFile,
            layout.projectDirectory.file('src/main/resources/fonts/EBGaramond-Italic.ttf').asFile,
            output.get().asFile,
            grandTheatreLabelCatalogue.get().asFile,
            'THEATRE',
            generatedMapAsset.get().asFile,
            west, south, east, north
        inputs.files(
            grandTheatreCandidateGlyphs,
            grandTheatreLabelCatalogue,
            generatedMapAsset,
            layout.projectDirectory.file('src/main/resources/fonts/EBGaramond-Regular.ttf'),
            layout.projectDirectory.file('src/main/resources/fonts/EBGaramond-Italic.ttf'))
        outputs.file output
    }
}

