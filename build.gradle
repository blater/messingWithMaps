            'src/mapTools/resources/labels/philip-1905-calibration.tsv').asFile,
        grandTheatreLabelCatalogue.get().asFile,
        layout.buildDirectory.file(
            'reports/reference-label-ocr/ocr-extraction-report.tsv').get().asFile,
        layout.projectDirectory.file(
            'src/mapTools/resources/labels/grand-theatre-layout-fallbacks.tsv').asFile,
        grandTheatreCandidateLines.get().asFile
    inputs.files(
        layout.projectDirectory.file(
            'src/mapTools/resources/labels/philip-1905-calibration.tsv'),
        grandTheatreLabelCatalogue,
        layout.buildDirectory.file(
            'reports/reference-label-ocr/ocr-extraction-report.tsv'),
        layout.projectDirectory.file(
            'src/mapTools/resources/labels/grand-theatre-layout-fallbacks.tsv'))
    outputs.file grandTheatreCandidateLines
}

